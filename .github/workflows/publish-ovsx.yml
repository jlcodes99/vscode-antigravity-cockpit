name: Publish to Open VSX Registry

on:
  push:
    tags:
      - 'v*'  # 当推送 v 开头的 tag 时触发,如 v2.0.2

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Type check webview (checkJs)
        run: npm run typecheck:webview

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Compile extension
        run: npm run compile
      
      - name: Package extension
        run: npx @vscode/vsce package
      
      - name: List VSIX files
        run: |
          echo "📦 生成的 VSIX 文件:"
          ls -lh *.vsix
      
      - name: Publish to Open VSX Registry
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          echo "🚀 开始发布到 Open VSX Registry..."
          VSIX_FILE=$(ls *.vsix)
          echo "📦 发布文件: $VSIX_FILE"
          npx ovsx publish "$VSIX_FILE" -p "$OVSX_TOKEN"
          echo "✅ 发布成功!"
      
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: '*.vsix'
          retention-days: 30

